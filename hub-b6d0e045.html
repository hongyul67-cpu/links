<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>내 도구 대시보드</title>
<!--
  개인 대시보드 (나만 쓰는 페이지)
  ─────────────────────────────────────────────────────────
  · 학생·동료에게 이 주소를 주지 마세요. 수업 배포는 [링크 복사]·[QR]로 개별 도구만 전달합니다.
  · 파일명이 추측 불가한 이유: 학생이 공유링크 주소를 /links/ 로 잘라도 이 페이지에 닿지 않게 하려는 것.
  · 도구 목록은 hub-tools.json 에만 있습니다 → 도구가 늘면 그 파일만 고치면 됩니다.
    필드: { name, url, category("공개"|"수업"|"개인"), description, copyrightFlag, privacyFlag }
-->
<style>
  :root{--bg:#0f1420;--card:#1a2130;--card2:#222c40;--line:#2c3852;--tx:#eef2fb;--dim:#9aa7c2;
        --accent:#5b8cff;--open:#38d39f;--class:#f0a742;--priv:#a78bfa;--warn:#ef4444}
  @media (prefers-color-scheme: light){:root{--bg:#f3f5fb;--card:#fff;--card2:#f7f9ff;--line:#e3e8f4;
        --tx:#1a2233;--dim:#5c6a86;--accent:#3565e6;--open:#12a97a;--class:#d98518;--priv:#7c5cf0;--warn:#dc2626}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard","Segoe UI",system-ui,-apple-system,sans-serif;
    line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 16px 60px}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:13px;margin:0 0 14px}
  .privnote{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid var(--warn);
    border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--warn);margin-bottom:14px}

  /* 검색 · 필터 (상단 고정) */
  .tools{position:sticky;top:0;background:var(--bg);padding:8px 0 10px;z-index:5;border-bottom:1px solid var(--line);margin-bottom:14px}
  .search{position:relative;margin-bottom:9px}
  .search input{width:100%;padding:11px 34px 11px 36px;border:1px solid var(--line);border-radius:10px;
    background:var(--card2);color:var(--tx);font-size:16px;font-family:inherit}
  .search input:focus{outline:none;border-color:var(--accent)}
  .search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:14px}
  .search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;
    color:var(--dim);cursor:pointer;font-size:17px;padding:2px 7px;display:none}
  .filters{display:flex;gap:7px;flex-wrap:wrap}
  .filters button{background:var(--card2);color:var(--dim);border:1px solid var(--line);border-radius:999px;
    padding:6px 13px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;transition:.12s}
  .filters button:hover{color:var(--tx)}
  .filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .filters button[data-f="공개"].on{background:var(--open);border-color:var(--open)}
  .filters button[data-f="수업"].on{background:var(--class);border-color:var(--class)}
  .filters button[data-f="개인"].on{background:var(--priv);border-color:var(--priv)}
  .hitinfo{color:var(--dim);font-size:12px;margin-top:8px}

  /* 카드 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:11px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;display:flex;flex-direction:column;gap:7px}
  .card.flagged{border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
  .top{display:flex;align-items:flex-start;gap:8px}
  .badge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
  .b-공개{color:var(--open);background:color-mix(in srgb,var(--open) 15%,transparent);border:1px solid var(--open)}
  .b-수업{color:var(--class);background:color-mix(in srgb,var(--class) 15%,transparent);border:1px solid var(--class)}
  .b-개인{color:var(--priv);background:color-mix(in srgb,var(--priv) 15%,transparent);border:1px solid var(--priv)}
  .flag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap;
    color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid var(--warn)}
  .nm{font-size:15px;font-weight:700;margin:0;flex:1;min-width:0}
  .nm a{color:inherit;text-decoration:none}
  .nm a:hover{color:var(--accent);text-decoration:underline}
  .desc{color:var(--dim);font-size:12.5px;margin:0}
  .acts{display:flex;gap:6px;margin-top:auto;padding-top:4px}
  .acts button{flex:1;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;
    padding:8px 6px;font-size:12.5px;cursor:pointer;font-family:inherit;font-weight:600}
  .acts button:hover{border-color:var(--accent);color:var(--accent)}
  .acts button.done{border-color:var(--open);color:var(--open)}
  .nohit{color:var(--dim);font-size:14px;text-align:center;padding:40px 0;display:none}

  /* QR 모달 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
  .modal.on{display:flex}
  .mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:380px;width:100%;text-align:center}
  .mttl{font-size:15px;font-weight:800;margin:0 0 3px}
  .murl{color:var(--dim);font-size:11px;word-break:break-all;margin:0 0 12px}
  .qrimg{width:min(280px,72vw);height:min(280px,72vw);margin:0 auto;background:#fff;border-radius:12px;padding:10px}
  .qrimg img{width:100%;height:100%;image-rendering:pixelated;display:block}
  .mrow{display:flex;gap:8px;margin-top:14px}
  .mrow button{flex:1;border-radius:9px;padding:10px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;
    background:var(--card2);color:var(--tx);border:1px solid var(--line)}
  .mrow button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
  footer{margin-top:30px;color:var(--dim);font-size:11.5px;text-align:center}
  @media (max-width:520px){ .wrap{padding:16px 12px 50px} h1{font-size:19px} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <h1>🗂️ 내 도구 대시보드</h1>
  <p class="sub">나만 쓰는 개인 페이지 · 수업 배포는 각 도구의 <b>[복사]</b>·<b>[QR]</b>로 개별 전달하세요.</p>
  <div class="privnote">🔒 이 주소는 공유하지 마세요. <b>⚠️</b> 표시 도구는 외부 기출·저작물 포함 → <b>공개 배포 금지, 개별 전달만</b>.</div>

  <div class="tools">
    <div class="search">
      <span class="ico">🔎</span>
      <input id="q" type="text" placeholder="도구 이름 검색" autocomplete="off">
      <button class="clr" id="qclr" title="지우기">✕</button>
    </div>
    <div class="filters" id="filters">
      <button data-f="전체" class="on">전체</button>
      <button data-f="공개">공개</button>
      <button data-f="수업">수업</button>
      <button data-f="개인">개인</button>
    </div>
    <div class="hitinfo" id="hitinfo"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="nohit" id="nohit">검색 결과가 없어요.</div>
  <footer>hub-tools.json 만 고치면 목록이 갱신됩니다 · noindex</footer>
</div>

<div class="modal" id="modal">
  <div class="mbox">
    <p class="mttl" id="mttl"></p>
    <p class="murl" id="murl"></p>
    <div class="qrimg" id="qrimg"></div>
    <div class="mrow">
      <button id="mcopy">링크 복사</button>
      <button class="pri" id="mclose">닫기</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
var TOOLS=[], curFilter="전체";
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

var grid=document.getElementById("grid"), noHit=document.getElementById("nohit"),
    qEl=document.getElementById("q"), qClr=document.getElementById("qclr"), hitInfo=document.getElementById("hitinfo");

function render(){
  var q=qEl.value.trim().toLowerCase();
  qClr.style.display=q?"block":"none";
  var list=TOOLS.filter(function(t){
    if(curFilter!=="전체" && t.category!==curFilter) return false;
    if(!q) return true;
    return ((t.name||"")+" "+(t.description||"")).toLowerCase().indexOf(q)>-1;
  });
  grid.innerHTML=list.map(function(t,i){
    var flags="";
    if(t.copyrightFlag) flags+='<span class="flag" title="외부 기출·저작물 포함 — 공개 배포 금지">⚠️ 저작권</span>';
    if(t.privacyFlag)   flags+='<span class="flag" title="교사 실명 등 개인정보 포함 — 공유 금지">🔒 개인정보</span>';
    return '<div class="card'+((t.copyrightFlag||t.privacyFlag)?" flagged":"")+'">'
      +'<div class="top"><span class="badge b-'+esc(t.category)+'">'+esc(t.category)+'</span>'+flags+'</div>'
      +'<p class="nm"><a href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(t.name)+'</a></p>'
      +'<p class="desc">'+esc(t.description||"")+'</p>'
      +'<div class="acts"><button data-copy="'+esc(t.url)+'">📋 복사</button>'
      +'<button data-qr="'+i+'">📱 QR</button></div></div>';
  }).join("");
  // 필터/검색 결과의 원본 인덱스를 버튼에 연결
  var btns=grid.querySelectorAll("[data-qr]");
  for(var k=0;k<btns.length;k++) btns[k].__tool=list[+btns[k].getAttribute("data-qr")];
  noHit.style.display=list.length?"none":"block";
  var by={공개:0,수업:0,개인:0}; list.forEach(function(t){by[t.category]=(by[t.category]||0)+1;});
  hitInfo.textContent="총 "+list.length+"개  ·  공개 "+by.공개+" · 수업 "+by.수업+" · 개인 "+by.개인;
}

/* 링크 복사 · QR (이벤트 위임) */
grid.addEventListener("click", function(e){
  var cp=e.target.closest("[data-copy]");
  if(cp){
    var url=cp.getAttribute("data-copy");
    var done=function(){ cp.textContent="✓ 복사됨"; cp.classList.add("done");
      setTimeout(function(){ cp.textContent="📋 복사"; cp.classList.remove("done"); },1500); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done, function(){fallback(url,done);}); }
    else fallback(url,done);
    return;
  }
  var qb=e.target.closest("[data-qr]");
  if(qb && qb.__tool) openQR(qb.__tool);
});
function fallback(text,cb){
  var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); cb(); }catch(err){ prompt("아래 주소를 복사하세요", text); }
  document.body.removeChild(ta);
}

var modal=document.getElementById("modal"), curUrl="";
function openQR(t){
  curUrl=t.url;
  document.getElementById("mttl").textContent=t.name;
  document.getElementById("murl").textContent=t.url;
  var box=document.getElementById("qrimg");
  if(typeof qrcode==="undefined"){ box.innerHTML='<div style="color:#dc2626;font-size:12px;padding:24px">QR 라이브러리를 못 불러왔어요(인터넷 확인).<br>링크 복사는 됩니다.</div>'; }
  else{
    try{
      var qr=qrcode(0,"M"); qr.addData(t.url); qr.make();   // 개별 도구 주소는 짧아 M(중간 보정)로 선명하게
      box.innerHTML='<img src="'+qr.createDataURL(10,8)+'" alt="QR">';
    }catch(err){ box.innerHTML='<div style="color:#dc2626;font-size:12px;padding:24px">QR 생성 실패</div>'; }
  }
  modal.classList.add("on");
}
document.getElementById("mclose").onclick=function(){ modal.classList.remove("on"); };
modal.addEventListener("click", function(e){ if(e.target===modal) modal.classList.remove("on"); });
document.addEventListener("keydown", function(e){ if(e.key==="Escape") modal.classList.remove("on"); });
document.getElementById("mcopy").onclick=function(){
  var b=this;
  var done=function(){ b.textContent="✓ 복사됨"; setTimeout(function(){ b.textContent="링크 복사"; },1500); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(curUrl).then(done,function(){fallback(curUrl,done);});
  else fallback(curUrl,done);
};

/* 검색 · 필터 */
qEl.addEventListener("input", render);
qClr.onclick=function(){ qEl.value=""; render(); qEl.focus(); };
document.getElementById("filters").addEventListener("click", function(e){
  var b=e.target.closest("button"); if(!b) return;
  curFilter=b.getAttribute("data-f");
  [].forEach.call(this.querySelectorAll("button"), function(x){ x.classList.toggle("on", x===b); });
  render();
});

/* 데이터 로드 — 목록은 hub-tools.json 에만 있습니다 */
fetch("hub-tools.json", {cache:"no-store"})
  .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(function(d){ TOOLS=d; render(); })
  .catch(function(err){
    grid.innerHTML='<div style="color:var(--dim);font-size:13.5px;padding:20px;border:1px solid var(--line);border-radius:12px">'
      +'목록(hub-tools.json)을 못 불러왔어요.<br><span style="font-size:12px">'+esc(String(err.message))+'</span></div>';
  });
</script>
</body>
</html>
