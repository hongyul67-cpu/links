<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학습 도구 모음</title>
<!--
  공유 모음 뷰어
  ─────────────────────────────────────────────────────────
  주소(?d=)에 담긴 도구 목록만 보여줍니다.
  이 파일에는 전체 도구 목록이 없습니다 → 공유해도 다른 도구가 노출되지 않아요.
  링크는 "링크모음 마스터"에서 만듭니다.

  🔒 2026-09-11 부터 마스터가 만드는 새 링크는 ?e= (암호화) 입니다.
     받은 사람이 이번 주 코드나 교사용 암호를 넣어야 목록이 풀립니다.
     풀 때 쓰는 감싼 키는 링크 허브의 tools.enc 에서 가져옵니다(암호 없이는 못 품).
     예전 ?d= 링크는 이미 나눠 준 QR 을 깨지 않도록 지금처럼 바로 열립니다.

  ⛔ 이미 나눠준 링크들이 "이 파일"을 계속 불러옵니다.
     · 이 파일을 고치면 예전에 준 링크에도 바로 반영됩니다 (보통은 좋은 일 — 개선이 자동 전파).
     · 그러나 아래는 절대 금지 → 예전 링크가 전부 깨집니다:
         1) 이 파일의 이름/위치 변경·삭제  (예전 링크가 404)
         2) ?d= 데이터 형식(필드 순서/이름) 변경
         3) links 저장소 삭제 또는 Pages 끄기
     · 형식을 바꿔야 하면: 새 버전 번호(v)를 쓰고, 아래에서 옛 버전(v1)도 계속 처리하세요.
-->
<style>
  :root{--bg:#0f1420;--card:#1a2130;--card2:#222c40;--line:#2c3852;--tx:#eef2fb;--dim:#9aa7c2;
        --accent:#5b8cff;--game:#38d39f;--concept:#5b8cff;--quiz:#f0a742}
  @media (prefers-color-scheme: light){:root{--bg:#f3f5fb;--card:#fff;--card2:#f7f9ff;--line:#e3e8f4;
        --tx:#1a2233;--dim:#5c6a86;--accent:#3565e6;--game:#12a97a;--concept:#3565e6;--quiz:#d98518}}
  *{box-sizing:border-box}
  /* 암호 칸 — type=password 는 휴대폰에서 한글 조합이 꺼져 천지인이 안 된다. 보통 칸을 점으로만 가린다 */
  .pwtext{-webkit-text-security:disc}
  .pwtext:placeholder-shown{-webkit-text-security:none}
  body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard","Segoe UI",system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:920px;margin:0 auto;padding:28px 18px 60px}
  h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:14px}
  details.section{margin:14px 0 0;border-top:1px solid var(--line)}
  details.section:first-of-type{border-top:0}
  summary.cat{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;padding:14px 2px 12px;
    font-size:15px;font-weight:800;color:var(--tx)}
  summary.cat::-webkit-details-marker{display:none}
  .chev{color:var(--accent);font-size:13px;transition:transform .18s;display:inline-block}
  details[open] .chev{transform:rotate(90deg)}
  .count{margin-left:auto;font-size:12px;font-weight:600;color:var(--dim);background:var(--card);
    border:1px solid var(--line);border-radius:999px;padding:1px 9px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:2px 0 6px}
  details.section:not([open]) > .grid{display:none}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:15px 16px;transition:.12s}
  a.card:hover{transform:translateY(-2px);border-color:var(--accent);background:var(--card2)}
  .name{font-size:16px;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .emoji{font-size:18px}
  .desc{color:var(--dim);font-size:13px;margin:0}
  .meta{display:flex;align-items:center;gap:8px;margin-top:10px}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .tag.t-game{color:var(--game);background:color-mix(in srgb,var(--game) 15%,transparent)}
  .tag.t-concept{color:var(--concept);background:color-mix(in srgb,var(--concept) 15%,transparent)}
  .tag.t-quiz{color:var(--quiz);background:color-mix(in srgb,var(--quiz) 15%,transparent)}
  footer{margin-top:34px;color:var(--dim);font-size:12px;text-align:center}
  .rcbar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:16px 0 4px}
  .rcnow{font-size:13.5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .rcnow .st{flex:1;min-width:180px}
  .rcnow button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 12px;
    font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .rcnow button.ghost{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
  .rcform{margin-top:10px;display:none}
  .rcform input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card2);
    color:var(--tx);font-size:13px;font-family:inherit}
  .rcform .frow{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
  .rcform a{color:var(--accent);font-size:12.5px}
  .rcerr{color:#ef4444;font-size:12.5px;margin-top:6px;min-height:16px}
  .ok{color:var(--game);font-weight:700}
  .bad{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;color:var(--dim);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="ttl">학습 도구 모음</h1><div class="sub" id="sub"></div></header>
  <div id="gatehost"></div>
  <div id="rcwrap"></div>
  <div id="app"></div>
  <footer id="ft"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<script>
var GH_USER="hongyul67-cpu";
var TYPE_ORDER={"게임":0,"개념":1,"문제풀이":2};
var TYPE_CLASS={"게임":"t-game","개념":"t-concept","문제풀이":"t-quiz"};
var LSK="rc_endpoint_v1";
/* 잠긴 링크를 풀 때 쓰는 감싼 키 묶음 — 링크 허브와 같은 파일, 같은 암호·주간 코드 */
var KIT_URL="https://hongyul67-cpu.github.io/links-master/tools.enc";

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function qp(n){try{return new URLSearchParams(location.search).get(n);}catch(e){return null;}}
function rank(t){return (t.type&&t.type in TYPE_ORDER)?TYPE_ORDER[t.type]:99;}
function fail(html){ document.getElementById("app").innerHTML='<div class="bad">'+html+'</div>'; }

/* ── 잠금 ─────────────────────────────────────────────
   links-master/master.html 에 같은 코드가 있다(내보내기 파일에도 그대로 들어감).
   고치면 둘 다 고칠 것. */
function gB64(s){s=String(s).replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function gateTry(pw,kit){
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:gB64(kit.kdf.salt),iterations:kit.kdf.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  }).then(function(kek){
    var i=0;
    function next(){
      if(i>=kit.keys.length)return Promise.reject(new Error("BADPW"));
      var k=kit.keys[i++];
      return crypto.subtle.decrypt({name:"AES-GCM",iv:gB64(k.iv)},kek,gB64(k.blob)).then(function(p){return JSON.parse(new TextDecoder().decode(p));},next);
    }
    return next();
  }).then(function(nfo){
    var d=new Date(),t=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2),e;
    if(nfo.nbf&&t<nfo.nbf){e=new Error("NOTYET");e.when=nfo.nbf;throw e;}
    if(nfo.exp&&t>=nfo.exp){e=new Error("EXPIRED");e.when=nfo.exp;throw e;}
    if(!nfo.sk)throw new Error("BADPW");
    return nfo.sk;
  });
}
function gateUnseal(sk,sealed){
  var u=gB64(sealed);
  return crypto.subtle.importKey("raw",gB64(sk),{name:"AES-GCM"},false,["decrypt"]).then(function(k){
    return crypto.subtle.decrypt({name:"AES-GCM",iv:u.slice(0,12)},k,u.slice(12));
  }).then(function(b){return new Uint8Array(b);},function(){throw new Error("BADLINK");});
}
/* opts.compact = true 면 화면을 막지 않고 목록 위에 작은 줄로만 뜬다.
   자작·공개 도구는 이미 보이는 상태이고, 코드가 필요한 것만 더 여는 경우다.
   opts.count = 코드로 열리는 도구 수 (화면에 알려 주려고) */
function gateMount(kit,sealed,host,onOpen,opts){
  opts=opts||{};
  var LS="share_pw_v1",opened=false;
  var box=document.createElement("div");
  if(opts.compact){
    box.innerHTML='<div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:16px 0 4px">'+
      '<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13.5px">'+
        '<span style="flex:1;min-width:190px">🔒 <b>코드가 있어야 열리는 자료'+(opts.count?' '+opts.count+'개':'')+'</b>가 더 있어요'+
        '<br><span style="color:var(--dim);font-size:12.5px">교과서·기출처럼 그대로 못 내보내는 자료입니다. 나머지는 아래에 이미 열려 있어요.</span></span>'+
        '<button type="button" data-g="show" style="background:var(--accent);color:#fff;border:0;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit">코드 넣기</button>'+
      '</div>'+
      '<div data-g="form" style="display:none;margin-top:10px">'+
        '<input type="text" class="pwtext" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="이번 주 코드 또는 암호" style="width:100%;box-sizing:border-box;padding:10px;font-size:15px;text-align:center;letter-spacing:2px;border:1px solid var(--line);border-radius:8px;background:var(--card2);color:var(--tx);font-family:inherit">'+
        '<button type="button" data-g="go" style="width:100%;margin-top:8px;padding:10px;font-size:14px;font-weight:800;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit">열기</button>'+
        '<div data-g="msg" style="margin-top:8px;min-height:16px;font-size:12.5px;color:var(--dim);line-height:1.5"></div>'+
      '</div></div>';
  } else {
    box.innerHTML='<div style="max-width:420px;margin:30px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 22px;text-align:center">'+
      '<div style="font-size:40px;line-height:1">🔒</div>'+
      '<h2 style="margin:10px 0 6px;font-size:19px">코드를 넣어 주세요</h2>'+
      '<p style="margin:0 0 16px;color:var(--dim);font-size:13.5px">선생님께 받은 <b>이번 주 코드(8자리)</b>나 암호를 넣으면 열려요.</p>'+
      '<input type="text" class="pwtext" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="이번 주 코드 또는 암호" style="width:100%;box-sizing:border-box;padding:12px;font-size:17px;text-align:center;letter-spacing:2px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--tx);font-family:inherit">'+
      '<button type="button" data-g="go" style="width:100%;margin-top:10px;padding:12px;font-size:15px;font-weight:800;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit">열기</button>'+
      '<div data-g="msg" style="margin-top:12px;min-height:18px;font-size:13px;color:var(--dim);line-height:1.5"></div>'+
      '<p style="margin:14px 0 0;font-size:11.5px;color:var(--dim)">한 번 열면 이 기기에서는 다음부터 바로 들어갑니다.<br>주간 코드는 그 주에만 통합니다.</p></div>';
  }
  host.appendChild(box);
  var inp=box.querySelector("input"),btn=box.querySelector("[data-g=go]"),msg=box.querySelector("[data-g=msg]");
  var showBtn=box.querySelector("[data-g=show]"),formEl=box.querySelector("[data-g=form]");
  if(showBtn)showBtn.onclick=function(){formEl.style.display="block";showBtn.style.display="none";inp.focus();};
  function say(t,bad){msg.innerHTML=t;msg.style.color=bad?"#ef4444":"";}
  function done(bytes){if(opened)return;opened=true;box.remove();onOpen(bytes);}
  function tryPw(pw){return gateTry(pw,kit).then(function(sk){return gateUnseal(sk,sealed);});}
  btn.onclick=function(){
    var pw=inp.value.replace(/\s+/g,"").normalize("NFC");
    if(!pw){inp.focus();return;}
    btn.disabled=true;say("여는 중…");
    tryPw(pw).then(function(b){try{localStorage.setItem(LS,pw);}catch(e){}done(b);},function(e){
      var m=e&&e.message;btn.disabled=false;
      say(m==="EXPIRED"?"사용 기간이 끝난 코드입니다 ("+e.when+"까지).<br>선생님께 이번 주 코드를 받으세요."
        :m==="NOTYET"?"아직 쓸 수 없는 코드입니다.<br>"+e.when+"부터 쓸 수 있어요."
        :m==="BADLINK"?"링크가 잘렸거나 손상됐어요.<br>전체 주소를 다시 받아 주세요."
        :"코드나 암호가 맞지 않습니다.",true);
      inp.value="";inp.focus();
    });
  };
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.isComposing&&e.keyCode!==229)btn.click();});
  /* 이 기기에 기억된 것만 조용히 시도한다 — 보낸 사람 기기에서만 바로 열리는 까닭.
     share_pw_v1 = 이 잠금에서 넣은 것 · hub_pw_v1·hong_pw_v1 = 허브·도구에서 넣은 것 */
  var tries=[];
  try{["share_pw_v1","hub_pw_v1","hong_pw_v1"].forEach(function(k){var v=localStorage.getItem(k);
    if(v&&tries.every(function(t){return t.v!==v;}))tries.push({k:k,v:v});});}catch(e){}
  (function next(i){
    if(opened)return;
    if(i>=tries.length){say("");if(!opts.compact)inp.focus();return;}
    if(i===0)say("여는 중…");
    tryPw(tries[i].v).then(done,function(){
      if(tries[i].k===LS){try{localStorage.removeItem(LS);}catch(e){}}   // 지난주 코드 등
      next(i+1);
    });
  })(0);
}

/* 지원하는 최신 형식 번호. 형식을 바꾸면 올리되, 옛 버전 처리는 지우지 말 것 */
var FMT_MAX = 2;

/* 모음 데이터를 받아 화면을 그린다.
   ?d= (자작·공개 도구)는 바로 · ?e= (교과서·기출이 든 도구)는 코드를 넣은 뒤 목록에 더해진다.
   두 번째 인자 SEALED 가 있으면 목록 위에 「코드 넣기」 줄만 뜨고 화면은 막지 않는다. */
function start(DATA, SEALED, LOCKN){
  var VER = (DATA && DATA.v) ? DATA.v : 1;   // v 없는 옛 링크 = 1로 취급

  if(!DATA || !DATA.l || !DATA.l.length){
    fail('😅 도구 목록을 불러오지 못했어요.<br>선생님께 받은 링크가 잘린 것 같아요 — 전체 주소를 다시 받아 주세요.');
    return;
  }
  if(VER > FMT_MAX){
    // 마스터가 뷰어보다 새 형식으로 만든 링크 (배포 순서가 어긋난 경우)
    fail('🔄 이 링크는 최신 형식이라 아직 열 수 없어요.<br>잠시 후 새로고침하거나, 선생님께 알려 주세요.');
    return;
  }
  /* ── 형식 v1 읽기 ── (예전 링크가 이 코드에 의존합니다. 지우지 마세요) */
  var TITLE=DATA.t||"학습 도구 모음";
  /* exec: g(배포ID만) 있으면 앞뒤 붙여 복원, 없으면 r(전체주소·옛 링크 호환) */
  var BAKED_RC=DATA.g ? ("https://script.google.com/macros/s/"+DATA.g+"/exec") : (DATA.r||"");
  var ALLOW_RC=!!DATA.a;
  /* f:1 — 수업용 「모두 같은 문제」. 도구 주소에 ?fix=1 을 붙여, 그날 연 학생 모두가
     같은 문제·같은 보기를 받게 한다. (도구 쪽 fixorder.js 가 처리) */
  var FIX=!!DATA.f;
  /* 압축용 배열 → 원래 형태로.
     v1: [emoji,name,desc,repo,url,cat,type]  ·  v2(간결): [emoji,name,repo,url,cat,type] (desc 없음) */
  function mapRow(a){
    return (VER>=2)
      ? { emoji:a[0]||"🔗", name:a[1]||"", desc:"",      repo:a[2]||"", url:a[3]||"", cat:a[4]||"기타", type:a[5]||"" }
      : { emoji:a[0]||"🔗", name:a[1]||"", desc:a[2]||"", repo:a[3]||"", url:a[4]||"", cat:a[5]||"기타", type:a[6]||"" };
  }
  var TOOLS=DATA.l.map(mapRow);
  var CATEGORIES=DATA.c||[];   // v2 엔 c 없음 → 도구 등장 순서로 분류

  document.title=TITLE;
  document.getElementById("ttl").textContent=TITLE;
  document.getElementById("ft").textContent=TITLE;
  document.getElementById("sub").textContent = ALLOW_RC
    ? "아래 카드를 누르면 도구가 열려요 · 결과를 받으려면 먼저 [내 시트 연결]"
    : (BAKED_RC ? "아래 카드를 누르면 도구가 열려요 · 결과는 선생님께 자동 제출됩니다"
                : "아래 카드를 누르면 도구가 열려요");

  function myRc(){try{return localStorage.getItem(LSK)||"";}catch(e){return "";}}
  function curRc(){return (ALLOW_RC&&myRc())||BAKED_RC||"";}
  function validRc(u){return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u);}
  function linkOf(t){
    var u=t.url||("https://"+GH_USER+".github.io/"+t.repo+"/");
    var rc=curRc();
    if(rc&&t.repo){
      u+=(u.indexOf("?")<0?"?":"&")+"rc="+encodeURIComponent(rc);
      u+="&name=1";              // 이름은 항상 받음(누가 냈는지 알아야 하므로)
    }
    if(FIX&&t.repo) u+=(u.indexOf("?")<0?"?":"&")+"fix=1";   // 모두 같은 문제
    return u;
  }

  var app=document.getElementById("app");
  function render(){
    app.innerHTML="";
    var cats=CATEGORIES.slice();
    TOOLS.forEach(function(t){ if(t.cat&&cats.indexOf(t.cat)<0)cats.push(t.cat); });
    cats.forEach(function(cat){
      var items=TOOLS.map(function(t,i){return {t:t,i:i};}).filter(function(o){return (o.t.cat||"기타")===cat;})
        .sort(function(a,b){return (rank(a.t)-rank(b.t))||(a.i-b.i);}).map(function(o){return o.t;});
      if(!items.length)return;
      var det=document.createElement("details"); det.className="section"; det.open=true;
      var cards=items.map(function(t){
        var tag=t.type?'<span class="tag '+(TYPE_CLASS[t.type]||"")+'">'+esc(t.type)+'</span>':"";
        var d=t.desc?'<p class="desc">'+esc(t.desc)+'</p>':'';
        return '<a class="card" href="'+esc(linkOf(t))+'"><p class="name"><span class="emoji">'+esc(t.emoji)+
               '</span>'+esc(t.name)+'</p>'+d+'<div class="meta">'+tag+'</div></a>';
      }).join("");
      det.innerHTML='<summary class="cat"><span class="chev">▸</span>'+esc(cat)+
                    '<span class="count">'+items.length+'</span></summary><div class="grid">'+cards+'</div>';
      app.appendChild(det);
    });
  }
  render();

  /* 코드가 필요한 도구가 따로 담겨 온 링크 — 목록 위에 작은 줄로만 띄운다.
     코드가 맞으면 그 도구들이 목록에 더해지고, 안 넣어도 위 목록은 그대로 쓴다. */
  if(SEALED){
    if(!window.LZString || !window.crypto || !crypto.subtle){
      document.getElementById("gatehost").innerHTML =
        '<div class="bad">🔒 코드로 열리는 자료가 더 있는데, 이 브라우저에서는 열 수 없어요. 크롬이나 사파리로 열어 주세요.</div>';
    } else {
      fetch(KIT_URL,{cache:"no-cache"}).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
        .then(function(blob){
          gateMount({kdf:blob.kdf,keys:blob.keys}, SEALED, document.getElementById("gatehost"), function(bytes){
            var ex=null;
            try{ ex=JSON.parse(LZString.decompressFromUint8Array(bytes)); }catch(e){ ex=null; }
            if(ex && ex.l && ex.l.length){ ex.l.forEach(function(a){ TOOLS.push(mapRow(a)); }); render(); }
          }, { compact:true, count:LOCKN||0 });
        })
        .catch(function(){
          document.getElementById("gatehost").innerHTML =
            '<div class="bad">🔒 코드로 열리는 자료를 준비하지 못했어요(인터넷 확인). 아래 목록은 그대로 쓸 수 있어요.</div>';
        });
    }
  }

  if(ALLOW_RC){
    document.getElementById("rcwrap").innerHTML =
      '<div class="rcbar"><div class="rcnow"><span class="st" id="rcst"></span>'+
      '<button id="rcopen">내 시트 연결</button>'+
      '<button class="ghost" id="rcclear" style="display:none">해제</button></div>'+
      '<div class="rcform" id="rcform"><input id="rcinput" type="text" placeholder="https://script.google.com/macros/s/.../exec">'+
      '<div class="frow"><button id="rcsave">저장</button><button class="ghost" id="rccancel">취소</button>'+
      '<a href="./guide.html" target="_blank">주소 만드는 법 (5분) →</a></div>'+
      '<div class="rcerr" id="rcerr"></div></div></div>';
    var st=document.getElementById("rcst"), form=document.getElementById("rcform"),
        input=document.getElementById("rcinput"), errEl=document.getElementById("rcerr"),
        openBtn=document.getElementById("rcopen"), clearBtn=document.getElementById("rcclear");
    function paint(){
      var mine=myRc();
      if(mine){ st.innerHTML='✅ <b class="ok">내 구글시트로 결과 수신 중</b>'; openBtn.textContent="주소 변경"; clearBtn.style.display=""; }
      else if(BAKED_RC){ st.innerHTML='📮 결과가 <b>공유해준 선생님 시트</b>로 갑니다 · 내 시트로 받으려면 →'; openBtn.textContent="내 시트 연결"; clearBtn.style.display="none"; }
      else { st.innerHTML='📌 결과를 <b>내 구글시트</b>로 받으려면 주소를 연결하세요 (안 하면 제출 버튼이 안 보여요)'; openBtn.textContent="내 시트 연결"; clearBtn.style.display="none"; }
      render();
    }
    openBtn.onclick=function(){ input.value=myRc()||""; form.style.display="block"; errEl.textContent=""; input.focus(); };
    document.getElementById("rccancel").onclick=function(){ form.style.display="none"; };
    document.getElementById("rcsave").onclick=function(){
      var v=(input.value||"").trim();
      if(!validRc(v)){ errEl.textContent="주소를 확인하세요. script.google.com/macros/s/.../exec 형태여야 해요."; return; }
      try{ localStorage.setItem(LSK,v); }catch(e){}
      form.style.display="none"; paint();
    };
    clearBtn.onclick=function(){ try{ localStorage.removeItem(LSK); }catch(e){} paint(); };
    paint();
  }
}

/* ── 시작 ── */
(function(){
  var sealed=qp("e");

  /* ?d= 가 있으면 그 목록은 코드 없이 바로 연다.
     · 옛 링크(?d= 만) — 이미 나눠 준 QR 이 그대로 열린다
     · 새 링크(?d= + ?e=) — 자작·공개 도구는 바로, 교과서·기출이 든 것만 코드로 */
  var DATA=null;
  try{
    var raw=qp("d");
    if(raw && window.LZString){
      var json=LZString.decompressFromEncodedURIComponent(raw);
      if(json) DATA=JSON.parse(json);
    }
  }catch(e){ DATA=null; }

  if(DATA){ start(DATA, sealed||null, DATA.k||0); return; }

  if(sealed){
    /* 고른 게 전부 교과서·기출이라 통째로 잠긴 링크 — 코드·암호를 넣어야 목록이 풀린다 */
    if(!window.LZString || !window.crypto || !crypto.subtle){
      fail('😅 이 브라우저에서는 잠긴 링크를 열 수 없어요.<br>크롬이나 사파리로 다시 열어 주세요.'); return;
    }
    fetch(KIT_URL,{cache:"no-cache"}).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(blob){
        gateMount({kdf:blob.kdf,keys:blob.keys}, sealed, document.getElementById("gatehost"), function(bytes){
          var d=null;
          try{ d=JSON.parse(LZString.decompressFromUint8Array(bytes)); }catch(e){ d=null; }
          start(d);
        });
      })
      .catch(function(){ fail('😅 잠금을 풀 준비를 하지 못했어요.<br>인터넷 연결을 확인하고 새로고침해 주세요.'); });
    return;
  }
  start(null);
})();
</script>
